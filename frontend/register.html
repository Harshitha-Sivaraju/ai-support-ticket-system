<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IT Support System</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">

    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* WRAPPER */
        .auth-wrapper {
            width: 100%;
            max-width: 470px;
            position: relative;
            z-index: 1;
            animation: pageEnter 0.8s ease forwards;
        }

        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* BRAND */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-bottom: 14px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--butter);
            color: var(--icon-color);
            font-size: 1.35rem;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .brand h1 {
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: color 0.4s ease;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.78rem;
            transition: color 0.4s ease;
        }

        /* CARD */
        .auth-card {
            width: 100%;
            padding: 24px;
            border-radius: 26px;
            background: var(--card-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--card-border);
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: var(--butter);
            opacity: 0.45;
        }

        /* TABS */
        .tab-switcher {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: var(--tab-bg);
            border: 1px solid var(--tab-border);
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 9px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active { background: var(--butter); color: var(--icon-color); }
        .tab-btn:hover:not(.active) { background: var(--tab-hover); color: var(--text-main); }

        .form-rows { display: flex; flex-direction: column; gap: 10px; }

        .btn-submit { width: 100%; padding: 11px; margin-top: 2px; }

        .auth-footer {
            text-align: center;
            margin-top: 14px;
            color: var(--text-faint);
            font-size: 0.83rem;
        }

        .auth-footer a { color: var(--text-muted); text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { color: var(--text-main); }

        /* MOBILE */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .auth-card { padding: 20px 16px; border-radius: 18px; }
            .brand h1 { font-size: 1.1rem; }
            .brand-icon { width: 44px; height: 44px; font-size: 1.1rem; }
            .form-rows { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- THEME TOGGLE -->
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
    </button>

    <div class="auth-wrapper">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-icon"><i class="bi bi-headset"></i></div>
            <h1>IT Support System</h1>
            <p>Create your account to get started</p>
        </div>

        <!-- CARD -->
        <div class="auth-card">

            <!-- ALERT -->
            <div class="alert-box" id="alertBox">
                <i id="alertIcon"></i>
                <span id="alertMsg"></span>
            </div>

            <!-- TABS -->
            <div class="tab-switcher">
                <button class="tab-btn active" id="employeeTab" onclick="switchTab('employee')">
                    <i class="bi bi-person-fill"></i> Employee
                </button>
                <button class="tab-btn" id="adminTab" onclick="switchTab('admin')">
                    <i class="bi bi-shield-fill"></i> Admin
                </button>
            </div>

            <!-- FORM -->
            <form id="registerForm">
                <div class="form-rows">

                    <div>
                        <label class="field-label">Full Name</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-person"></i></span>
                            <input type="text" id="name" required>
                        </div>
                    </div>

                    <div>
                        <label class="field-label">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" required>
                        </div>
                    </div>

                    <div>
                        <label class="field-label">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" required>
                        </div>
                    </div>

                    <div>
                        <label class="field-label">Team</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-people"></i></span>
                            <select id="team_id" required>
                                <option value="" disabled selected>Loading teams...</option>
                            </select>
                        </div>
                    </div>

                    <div id="phoneField">
                        <label class="field-label">Phone Number</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-telephone"></i></span>
                            <input type="text" id="phone">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-submit" id="registerBtn">
                        <i class="bi bi-person-plus-fill"></i>
                        <span id="btnText">Create Account</span>
                    </button>

                </div>
            </form>

        </div>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>

    </div>

    <script src="js/register.js"></script>
    <script>
        const toggleTheme = () => {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };

        // load saved theme on page load
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').className =
            savedTheme === 'light' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    </script>
</body>
</html>
