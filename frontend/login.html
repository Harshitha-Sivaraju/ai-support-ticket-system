<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Support System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: var(--text-main);
            -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
            box-shadow: 0 0 0 1000px transparent inset !important;
            background-color: transparent !important;
            transition: background-color 9999s ease-in-out 0s;
        }
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            animation: pageEnter 0.8s ease forwards;
        }

        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-bottom: 14px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--butter);
            color: var(--icon-color);
            font-size: 1.35rem;
        }

        .brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
        .brand p  { color: var(--text-muted); font-size: 0.78rem; }

        .auth-card {
            padding: 24px;
            border-radius: 26px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0; left: 10%;
            width: 80%; height: 1px;
            background: var(--butter);
            opacity: 0.45;
        }

        .tab-switcher {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: var(--tab-bg);
            border: 1px solid var(--tab-border);
            border-radius: 14px;
            margin-bottom: 18px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 9px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active { background: var(--butter); color: var(--icon-color); }
        .tab-btn:hover:not(.active) { background: var(--tab-hover); color: var(--text-main); }

        .form-rows { display: flex; flex-direction: column; gap: 10px; }

        .btn-submit {
            width: 100%;
            padding: 11px;
            margin-top: 2px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 14px;
            color: var(--text-faint);
            font-size: 0.83rem;
        }

        .auth-footer a { color: var(--text-muted); text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { color: var(--text-main); }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .auth-card { padding: 20px 16px; border-radius: 18px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
    </button>

    <div class="auth-wrapper">

        <div class="brand">
            <div class="brand-icon"><i class="bi bi-headset"></i></div>
            <h1>IT Support System</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="auth-card card">

            <div class="alert-box" id="alertBox">
                <i id="alertIcon"></i>
                <span id="alertMsg"></span>
            </div>

            <div class="tab-switcher">
                <button class="tab-btn active" id="employeeTab" onclick="switchTab('employee')">
                    <i class="bi bi-person-fill"></i> Employee
                </button>
                <button class="tab-btn" id="adminTab" onclick="switchTab('admin')">
                    <i class="bi bi-shield-fill"></i> Admin
                </button>
            </div>

            <form id="loginForm">
                <div class="form-rows">

                    <div>
                        <label class="field-label">Email Address</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" required>
                        </div>
                    </div>

                    <div>
                        <label class="field-label">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-submit" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <span id="btnText">Sign In</span>
                    </button>

                </div>
            </form>

        </div>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register here</a>
        </div>

    </div>

    <script src="js/login.js"></script>
    <script>
        const toggleTheme = () => {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').className = savedTheme === 'light' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    </script>
</body>
</html>
