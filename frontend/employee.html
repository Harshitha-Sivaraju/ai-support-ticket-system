<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | IT Support</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">

    <style>

        /* =========================================
           PAGE / VIEWPORT
           ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }


        /* =========================================
           TOPBAR
           ========================================= */

        .topbar {
            height: 58px;
            min-height: 58px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            border-bottom: 1px solid var(--divider);
            background: var(--card-bg);
            backdrop-filter: blur(20px);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;

            background: var(--butter);
            color: var(--icon-color);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1rem;
        }

        .topbar-brand span {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 5px 12px;
            border-radius: 20px;

            background: var(--tab-bg);
            border: 1px solid var(--tab-border);

            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .user-chip i {
            color: var(--butter);
        }

        .btn-logout {
            border: 1px solid var(--card-border);
            border-radius: 9px;

            background: transparent;
            color: var(--text-muted);

            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;

            cursor: pointer;
            padding: 6px 12px;

            display: flex;
            align-items: center;
            gap: 5px;

            transition: all 0.25s ease;
        }

        .btn-logout:hover {
            border-color: var(--badge-open-cl);
            color: var(--badge-open-cl);
        }


        /* =========================================
           MAIN LAYOUT
           ========================================= */

        .main-layout {
            flex: 1;
            min-height: 0;

            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;

            height: calc(100vh - 58px);

            overflow: hidden;
        }


        /* =========================================
           LEFT PANEL
           ========================================= */

        .left-panel {
            min-height: 0;

            border-right: 1px solid var(--divider);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--divider);

            flex-shrink: 0;
        }

        .panel-title {
            font-size: 0.78rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;

            color: var(--text-muted);
            margin-bottom: 14px;
        }


        /* =========================================
           SUBMIT FORM
           ========================================= */

        .submit-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-wrap textarea {
            min-height: 80px;
            padding: 10px 14px 10px 0;
            line-height: 1.5;
        }

        .btn-submit-issue {
            width: 100%;
            padding: 10px;
        }


        /* =========================================
           ISSUES LIST
           ========================================= */

        .issues-list {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 8px 0;
        }

        .issue-item {
            padding: 14px 20px;
            cursor: pointer;

            border-bottom: 1px solid var(--divider);

            transition: background 0.2s ease;
        }

        .issue-item:hover {
            background: var(--row-hover);
        }

        .issue-item.active {
            background: var(--row-hover);
            border-left: 2px solid var(--butter);
        }

        .issue-item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 5px;
        }

        .issue-id {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--butter);
            opacity: 0.8;
        }

        .issue-date {
            font-size: 0.7rem;
            color: var(--text-faint);
        }

        .issue-query {
            font-size: 0.84rem;
            color: var(--text-main);
            line-height: 1.4;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;

            color: var(--text-faint);
            font-size: 0.85rem;
        }

        .empty-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.4;
        }


        /* =========================================
           RIGHT PANEL
           ========================================= */

        .right-panel {
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .detail-placeholder {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: var(--text-faint);
        }

        .detail-placeholder i {
            font-size: 2.5rem;
            opacity: 0.3;
        }

        .detail-placeholder p {
            font-size: 0.85rem;
        }


        /* =========================================
           ISSUE DETAIL
           ========================================= */

        .issue-detail {
            display: none;

            flex-direction: column;

            height: 100%;
            min-height: 0;

            overflow: hidden;

            padding: 24px;
            gap: 18px;

            box-sizing: border-box;
        }

        .issue-detail.visible {
            display: flex;
        }


        /* =========================================
           ISSUE HEADER
           ========================================= */

        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 12px;

            flex-shrink: 0;
        }

        .detail-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-meta .issue-id-lg {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--butter);
        }

        .detail-meta .detail-date {
            font-size: 0.82rem;
            color: var(--text-faint);
        }


        /* =========================================
           SECTION LABEL
           ========================================= */

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;

            color: var(--text-muted);

            margin-bottom: 8px;
        }


        /* =========================================
           QUERY
           ========================================= */

        .query-box {
            padding: 14px 16px;

            border-radius: 14px;

            background: var(--input-bg);
            border: 1px solid var(--input-border);

            font-size: 0.97rem;
            line-height: 1.6;

            color: var(--text-main);

            flex-shrink: 0;
        }


        /* =========================================
           CHAT SECTION
           ========================================= */

        .chat-section {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }


        /* =========================================
           AI RESPONSE HEADER
           ========================================= */

        .ai-box-header {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 10px;

            font-size: 0.82rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;

            color: var(--butter);

            flex-shrink: 0;
        }


        /* =========================================
           CHAT BOX
           
           THIS RECTANGLE STAYS IN PLACE.
           ONLY CONTENT INSIDE IT SCROLLS.
           ========================================= */

        .ai-box {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 16px;

            border-radius: 14px;

            background: var(--tab-bg);
            border: 1px solid var(--tab-border);

            font-size: 0.93rem;
            line-height: 1.7;

            color: var(--text-muted);

            box-sizing: border-box;

            scrollbar-width: thin;
        }


        /* =========================================
           CHAT MESSAGES
           
           IMPORTANT:
           NO overflow here.
           The parent .ai-box is the ONLY
           scrolling container.
           ========================================= */

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            padding: 10px 14px;

            border-radius: 12px;

            font-size: 0.93rem;
            line-height: 1.6;

            white-space: pre-wrap;

            width: 100%;

            box-sizing: border-box;
        }

        .chat-bubble.gemini {
            background: var(--tab-bg);
            border: 1px solid var(--tab-border);

            color: var(--text-muted);
        }

        .chat-bubble.user {
            background: rgba(247,223,155,0.1);
            border: 1px solid rgba(247,223,155,0.2);

            color: var(--text-main);
        }

        .chat-label {
            font-size: 0.75rem;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.6px;

            margin-bottom: 3px;
        }

        .chat-label.gemini {
            color: var(--butter);
        }

        .chat-label.user {
            color: var(--text-faint);
            text-align: right;
        }


        /* =========================================
           FOLLOW-UP INPUT
           
           NEVER SCROLLS WITH CHAT
           ========================================= */

        .chat-input-row {
            display: flex;
            gap: 8px;

            margin-top: 10px;

            align-items: center;

            flex-shrink: 0;
        }


        /* =========================================
           ESCALATE BUTTON
           ========================================= */

        .btn-escalate {
            border: 1px solid var(--text-muted);
            border-radius: 13px;

            background: transparent;
            color: var(--text-muted);

            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;

            cursor: pointer;

            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 8px 16px;

            transition: all 0.25s ease;
        }

        .btn-escalate:hover {
            border-color: #f7b432;
            color: #f7b432;
        }


        /* =========================================
           BOTTOM ACTION BUTTONS
           
           ALWAYS STAY IN THEIR POSITION.
           ========================================= */

        #detailActions {
            display: flex;
            gap: 10px;

            flex-wrap: wrap;

            flex-shrink: 0;

            margin-top: 0;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 768px) {

            html,
            body {
                overflow: hidden;
            }

            .main-layout {
                grid-template-columns: 1fr;

                height: calc(100vh - 58px);
                min-height: 0;
            }

            .left-panel {
                height: 50vh;

                border-right: none;
                border-bottom: 1px solid var(--divider);
            }

            .right-panel {
                height: 50vh;
                min-height: 0;
            }

        }

    </style>
</head>

<body>

    <!-- THEME TOGGLE -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <i class="bi bi-moon-fill" id="themeIcon"></i>
    </button>


    <!-- TOPBAR -->
    <div class="topbar">

        <div class="topbar-brand">

            <div class="brand-icon">
                <i class="bi bi-headset"></i>
            </div>

            <span>IT Support System</span>

        </div>


        <div class="topbar-right">

            <div class="user-chip">

                <i class="bi bi-person-fill"></i>

                <span id="userName">
                    Employee
                </span>

            </div>


            <div class="user-chip" style="font-size:0.75rem">

                <i class="bi bi-people-fill"></i>

                <span id="teamChip">
                    Team
                </span>

            </div>


            <button class="btn-logout" onclick="logout()">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>


    <!-- MAIN LAYOUT -->
    <div class="main-layout">


        <!-- =====================================
             LEFT: SUBMIT + ISSUE LIST
             ===================================== -->

        <div class="left-panel">


            <div class="panel-header">

                <div class="panel-title">
                    Submit New Issue
                </div>


                <div class="alert-box" id="alertBox">

                    <i id="alertIcon"></i>

                    <span id="alertMsg"></span>

                </div>


                <form class="submit-form" id="issueForm">


                    <div>

                        <label class="field-label">
                            Describe your issue
                        </label>


                        <div class="input-wrap">

                            <textarea
                                id="queryInput"
                                rows="3"
                                required
                            ></textarea>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn-primary btn-submit-issue"
                        id="submitBtn"
                    >

                        <i class="bi bi-send-fill"></i>

                        <span id="submitBtnText">
                            Submit Issue
                        </span>

                    </button>


                </form>

            </div>


            <div
                class="panel-title"
                style="padding: 14px 20px 0; font-size:0.72rem;"
            >
                My Issues
            </div>


            <div
                class="issues-list"
                id="issuesList"
            >

                <div class="empty-state">

                    <i class="bi bi-inbox"></i>

                    Loading your issues...

                </div>

            </div>


        </div>



        <!-- =====================================
             RIGHT: ISSUE DETAIL
             ===================================== -->

        <div class="right-panel">


            <!-- PLACEHOLDER -->
            <div
                class="detail-placeholder"
                id="detailPlaceholder"
            >

                <i class="bi bi-cursor-text"></i>

                <p>
                    Select an issue to view details
                </p>

            </div>



            <!-- ISSUE DETAIL -->
            <div
                class="issue-detail"
                id="issueDetail"
            >


                <!-- ISSUE HEADER -->
                <div class="detail-header">

                    <div class="detail-meta">

                        <span
                            class="issue-id-lg"
                            id="detailId"
                        ></span>


                        <span
                            class="detail-date"
                            id="detailDate"
                        ></span>

                    </div>


                    <span
                        class="badge"
                        id="detailBadge"
                    ></span>

                </div>



                <!-- QUERY -->
                <div>

                    <div class="section-label">
                        Your Query
                    </div>


                    <div
                        class="query-box"
                        id="detailQuery"
                    ></div>

                </div>



                <!-- CHAT SECTION -->
                <div class="chat-section">


                    <!-- AI RESPONSE TITLE -->
                    <div class="ai-box-header">

                        <i class="bi bi-stars"></i>

                        AI Response

                    </div>



                    <!--
                        FIXED CHAT RECTANGLE

                        ONLY THIS ELEMENT SCROLLS.
                        EVERYTHING AROUND IT STAYS FIXED.
                    -->
                    <div
                        class="ai-box"
                        id="chatMessages"
                    ></div>



                    <!-- FOLLOW-UP INPUT -->
                    <div class="chat-input-row">


                        <div
                            class="input-wrap"
                            style="flex:1;margin:0"
                        >

                            <input
                                type="text"
                                id="chatInput"
                                placeholder="Ask a follow-up question..."
                                autocomplete="off"
                            >

                        </div>


                        <button
                            class="btn-primary"
                            id="chatSendBtn"
                            onclick="sendChat()"
                            style="padding:9px 16px;font-size:0.82rem"
                        >

                            <i class="bi bi-send-fill"></i>

                        </button>


                    </div>


                </div>



                <!--
                    BOTTOM ACTION BUTTONS

                    These stay OUTSIDE the scrolling
                    chat area and remain visible.
                -->
                <div
                    id="detailActions"
                    style="
                        display:flex;
                        gap:10px;
                        flex-wrap:wrap;
                        flex-shrink:0;
                    "
                ></div>


            </div>

        </div>


    </div>



    <!-- EMPLOYEE JAVASCRIPT -->
    <script src="js/employee.js"></script>


    <!-- THEME SCRIPT -->
    <script>

        const toggleTheme = () => {

            const html = document.documentElement;

            const icon = document.getElementById('themeIcon');

            const isDark =
                html.getAttribute('data-theme') === 'dark';


            html.setAttribute(
                'data-theme',
                isDark ? 'light' : 'dark'
            );


            icon.className =
                isDark
                    ? 'bi bi-sun-fill'
                    : 'bi bi-moon-fill';


            localStorage.setItem(
                'theme',
                isDark ? 'light' : 'dark'
            );

        };


        const savedTheme =
            localStorage.getItem('theme') || 'dark';


        document.documentElement.setAttribute(
            'data-theme',
            savedTheme
        );


        document.getElementById(
            'themeIcon'
        ).className =
            savedTheme === 'light'
                ? 'bi bi-sun-fill'
                : 'bi bi-moon-fill';

    </script>

</body>
</html>
